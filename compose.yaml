services:
  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
  frontend:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend:ro
    restart: unless-stopped
