[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-sgdlm"
version = "0.2.0"
description = "Bayesian inference and forecasting for simultaneous graphical dynamic linear models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Pablo Reyes"}]
keywords = ["bayesian", "time-series", "forecasting", "sgdlm", "dynamic-linear-model"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn[standard]>=0.27"]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14"]
docs = ["mkdocs>=1.6"]
frontend = ["streamlit>=1.40"]
dev = [
  "bayesian-sgdlm[api,docs,excel,frontend]",
  "httpx>=0.27",
  "mypy>=1.8",
  "numpy<2.3",
  "pandas-stubs>=2.0",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
sgdlm = "sgdlm.cli:main"

[project.urls]
Homepage = "https://github.com/pablo-reyes8/bayesian-sgdlm"
Repository = "https://github.com/pablo-reyes8/bayesian-sgdlm"
Issues = "https://github.com/pablo-reyes8/bayesian-sgdlm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"

[tool.coverage.run]
source = ["sgdlm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
packages = ["sgdlm"]
exclude = ["src/sgdlm/api.py"]
